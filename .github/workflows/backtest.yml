name: Football AI - historical backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download historical data
        run: python download_data.py

      - name: Run v0.2 baseline
        run: python backtest.py

      - name: Run v0.3 Poisson comparison
        run: python poisson_backtest.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-ai-backtest-v03
          path: output/
